name = "waypoint-stats"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://waypointmods.github.io/"
SITE_REPO = "WaypointMods/waypointmods.github.io"

# Both only do something once the BUILD_TOKEN secret is set (see index.js):
# every minute, look for new releases and deleted repos; every 6 hours, a safety-net build.
[triggers]
crons = ["* * * * *", "17 */6 * * *"]
