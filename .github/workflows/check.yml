name: Check mod entries

on:
  pull_request:
    paths:
      - 'mods/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build.mjs --check
