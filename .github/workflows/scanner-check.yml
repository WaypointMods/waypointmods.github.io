name: Check virus scanners

# Run from the Actions tab after adding or changing the VT_API_KEY secret, or any time you want to
# confirm both the full scan (VirusTotal) and the private scan (ClamAV) still work.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/scanner-check.mjs
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
