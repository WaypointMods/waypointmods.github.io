name: Build site

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 */6 * * *'   # safety net; the stats Worker starts builds within minutes of a new release
  workflow_dispatch:

permissions:
  contents: write   # commit state/assets.json
  issues: write     # open "Review needed" issues
  pages: write
  id-token: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # newest scan state, not the commit that queued this run
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
      - name: Save scan state
        run: |
          if git diff --quiet -- state/ && [ -z "$(git ls-files --others --exclude-standard state/)" ]; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          keep="$RUNNER_TEMP/state"; mkdir -p "$keep"
          cp state/*.json "$keep/"
          for f in assets vt-quota; do git show "HEAD:state/$f.json" > "$keep/$f.base.json" 2>/dev/null || rm -f "$keep/$f.base.json"; done
          # Another build may have saved first: merge onto the newest main, never overwrite it.
          for try in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            node scripts/merge-state.mjs "$keep"
            git add state/
            if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
            git commit -q -m "Update scan state [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
