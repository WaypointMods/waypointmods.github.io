name: Mod submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write   # commit mods/<id>.json to main
  issues: write     # reply and close
  actions: write    # start the site build

# One at a time, so two submissions never race for the same name or push at once.
concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  submission:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'submission') ||
       contains(github.event.issue.labels.*.name, 'edit'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The issue body is untrusted. It is only ever read by the script from the event file,
      # never pasted into a shell command.
      - name: Check the form
        id: parse
        run: node scripts/submission.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.parse.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.parse.outputs.title }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/
          if ! git diff --cached --quiet; then
            git commit -m "$TITLE (#$ISSUE)"
            git pull --rebase origin main
            git push origin HEAD:main
            # Pushes made by this workflow don't trigger other workflows, so start the build directly.
            gh workflow run build.yml --ref main
          fi
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE" --reason completed

      - name: Reply with problems
        if: steps.parse.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"
