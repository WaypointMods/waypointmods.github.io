name: Change your mod (filled in by the Waypoint page)
description: Opened by the Change your mod page on waypointmods.github.io, with your changes filled in. Start on that page.
title: "Edit: "
labels: ["edit"]
body:
  - type: markdown
    attributes:
      value: |
        Your changes from the Waypoint page are filled in below. Add new screenshots if you like, then press **Create**.
        Anything not listed below stays as it is.
  # The bot never lets an empty box replace an answer, so "Screenshots: none" from the page stays
  # even though this box is empty.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. New screenshots replace all the current ones. Drag or paste up to 8 images here; the first one becomes the cover."
  - type: textarea
    id: answers
    attributes:
      label: Your changes
      description: Filled in by the Change your mod page. Edit carefully, keeping each `###` line as it is.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Only if the Waypoint page said your description was too long to carry over: paste it here (it's on your clipboard). Otherwise leave this empty."
