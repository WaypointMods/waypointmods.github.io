name: Add your mod
description: Put your mod on the site. Your files stay in your own GitHub repository. Checked automatically.
title: "Add: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start, publish a release on your mod's GitHub repository with the .7z, .zip or .rar attached.
        Automatic checks reply here within a minute or two. If everything passes, your mod usually goes live 2 to 5 minutes later, once its files are virus-scanned.
        You can only add repositories you own.
        By adding a mod, you let Waypoint show its name, description, screenshots and the other details you send, and link to its files. They stay yours: you can change them or take the mod off Waypoint at any time.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: "owner/name, or paste the GitHub link. It must be public."
      placeholder: your-name/your-mod
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Mod name
      description: Up to 80 characters. The mod's page address is made from this.
    validations:
      required: true
  - type: input
    id: author-name
    attributes:
      label: Display name
      description: "Optional. The author name shown on the site, for example your Nexus name. Your GitHub name is shown next to it. Leave empty to use your GitHub name."
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence, up to 160 characters. Shown on mod cards.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Animation
        - Armour and Weapons
        - Audio
        - Bug Fixes
        - Combat
        - Followers
        - Gameplay
        - Immersion
        - Patches
        - Quests
        - UI
        - Utilities
        - Visuals
        - Other
    validations:
      required: true
  - type: checkboxes
    id: games
    attributes:
      label: Games
      description: Tick every version the mod works on.
      options:
        - label: Skyrim SE/AE
        - label: Skyrim VR
        - label: Skyrim LE
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Supports BBCode ([b], [size], [color], [url], [img], [list], [spoiler], [youtube] and more) and Markdown. For headings use [size] or ## (not ###)."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. Drag or paste up to 8 images here (PNG, JPG, GIF or WebP). GitHub hosts them for free."
  - type: input
    id: cover
    attributes:
      label: Cover picture
      description: "Which screenshot is the cover? It's shown on your mod's card and as the banner on its page. 1 for the first, 2 for the second, and so on. Leave empty to use the first."
      placeholder: "1"
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "One per line, as Name | link. Leave empty if it only needs the base game."
      placeholder: "SKSE | https://skse.silverlock.org/"
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to 8, separated by commas.
      placeholder: lighting, roads, night
  - type: dropdown
    id: ai
    attributes:
      label: AI use
      description: "Be honest: it's shown on your mod's card and page, and visitors can filter by it. AI-assisted means AI helped (for example with code, translation or touch-ups) but the work is mainly yours. AI-generated means a large part, such as voices, textures or models, was made by AI."
      options:
        - No AI used
        - "AI-assisted: AI helped, but the work is mainly mine"
        - "AI-generated: a large part was made by AI"
    validations:
      required: true
  - type: checkboxes
    id: ai-parts
    attributes:
      label: Which parts used AI?
      description: Only if you used AI. Tick every part it was used for.
      options:
        - label: Voices or other audio
        - label: Textures or images
        - label: Meshes or models
        - label: Scripts or code
        - label: Text, dialogue or descriptions
  - type: markdown
    attributes:
      value: |
        ### Permissions
        What may other people do with your mod? This is shown on your mod's Permissions tab.
  - type: dropdown
    id: perm-upload
    attributes:
      label: Upload to other sites
      options: ["Yes", "Ask me first", "No"]
      default: 1
  - type: dropdown
    id: perm-modify
    attributes:
      label: Modify and re-release
      description: For example fixes, patches or translations that include your files.
      options: ["Yes", "Ask me first", "No"]
      default: 1
  - type: dropdown
    id: perm-convert
    attributes:
      label: Convert to other games or versions
      description: For example to Skyrim VR or LE.
      options: ["Yes", "Ask me first", "No"]
      default: 1
  - type: dropdown
    id: perm-assets
    attributes:
      label: Use assets in other mods
      description: Meshes, textures, sounds or scripts used in someone else's mod.
      options: ["Yes", "Ask me first", "No"]
      default: 1
  - type: dropdown
    id: perm-commercial
    attributes:
      label: Use in paid or commercial mods
      options: ["Yes", "Ask me first", "No"]
      default: 2
  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: "Optional. People whose work you used or who helped. Same formatting as the description."
  - type: textarea
    id: permission-notes
    attributes:
      label: Permission notes
      description: Optional. Anything else people should know, for example "credit me if you use my textures".
  - type: input
    id: donate
    attributes:
      label: Donation link
      description: "Optional. Your Ko-fi, Patreon, PayPal or similar page, shown as a Support the author button. Tips go straight to you. If your repository has a FUNDING.yml (GitHub's Sponsor button), those links are shown too."
      placeholder: https://ko-fi.com/yourname
  - type: dropdown
    id: scan
    attributes:
      label: Virus scan
      description: |
        How your files are checked before they can be downloaded here. Visitors see which one you picked.
        Private scan (recommended): ClamAV scans the file inside GitHub's build, and only the file's fingerprint (not the file) is sent to VirusTotal to see if any engine already knows it as malware. Your file never leaves GitHub.
        Full scan: VirusTotal checks the file with 70+ antivirus engines, which catches more brand-new malware. Files it hasn't seen before are uploaded to it, and its paid users (security companies) can access uploaded files.
        No scan: nothing is checked, and your mod shows a red Not virus-scanned warning.
      options:
        - "Private scan: ClamAV + VirusTotal fingerprint (recommended)"
        - Full scan with VirusTotal
        - No scan
      default: 0
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I made this mod, or I have the author's permission to list it.
          required: true
        - label: It contains no sexually explicit content.
          required: true
        - label: It's free to download. If supporters get a newer version first somewhere else (early access), it's released here for free within 3 months.
          required: true
