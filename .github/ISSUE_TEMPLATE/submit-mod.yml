name: Add your mod
description: Put your mod on the site. Your files stay in your own GitHub repository. No approval needed.
title: "Add: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start, publish a release on your mod's GitHub repository with the .7z, .zip or .rar attached.
        Automatic checks reply here within a minute or two. If everything passes, your mod usually goes live 2 to 5 minutes later, once its files are virus-scanned.
        You can only add repositories you own.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: "owner/name, or paste the GitHub link. It must be public."
      placeholder: your-name/your-mod
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Mod name
      description: Up to 80 characters. The mod's page address is made from this.
    validations:
      required: true
  - type: input
    id: author-name
    attributes:
      label: Display name
      description: "Optional. The author name shown on the site, for example your Nexus name. Your GitHub name is shown next to it. Leave empty to use your GitHub name."
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence, up to 160 characters. Shown on mod cards.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Animation
        - Armour and Weapons
        - Audio
        - Bug Fixes
        - Combat
        - Followers
        - Gameplay
        - Immersion
        - Patches
        - Quests
        - UI
        - Utilities
        - Visuals
        - Other
    validations:
      required: true
  - type: checkboxes
    id: games
    attributes:
      label: Games
      description: Tick every version the mod works on.
      options:
        - label: Skyrim SE/AE
        - label: Skyrim VR
        - label: Skyrim LE
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "You can use `## Heading`, `- list items`, `**bold**`, `` `code` `` and `[links](https://...)`."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Optional. Drag or paste up to 8 images here (PNG, JPG, GIF or WebP). The first one is the cover picture. GitHub hosts them for free."
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "One per line, as Name | link. Leave empty if it only needs the base game."
      placeholder: "SKSE | https://skse.silverlock.org/"
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to 8, separated by commas.
      placeholder: lighting, roads, night
  - type: checkboxes
    id: scan
    attributes:
      label: Virus scan
      description: "Your files are checked with VirusTotal before they can be downloaded here. VirusTotal may share uploaded files with its paid users. If you skip the scan, your mod is listed a little sooner but carries a clear Not virus-scanned warning on its card and page."
      options:
        - label: Skip the virus scan for this mod.
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: I made this mod, or I have the author's permission to list it.
          required: true
        - label: It contains no sexually explicit content.
          required: true
        - label: Nothing in it is paywalled or "early access".
          required: true
