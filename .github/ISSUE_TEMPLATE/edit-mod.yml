name: Edit a mod
description: Change a listed mod's details, screenshots, AI disclosure, permissions or virus scan setting.
title: "Edit: "
labels: ["edit"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in only what you want to change; empty fields stay as they are.
        New versions don't need this form: publish a new GitHub release and the site picks it up.
  - type: input
    id: id
    attributes:
      label: Mod ID
      description: The part after `?id=` in the mod page address.
      placeholder: wayfarers-lanterns
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Mod name
  - type: input
    id: author-name
    attributes:
      label: Display name
      description: "The author name shown on the site. Write none to go back to your GitHub name."
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Up to 160 characters.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - No change
        - Animation
        - Armour and Weapons
        - Audio
        - Bug Fixes
        - Combat
        - Followers
        - Gameplay
        - Immersion
        - Patches
        - Quests
        - UI
        - Utilities
        - Visuals
        - Other
      default: 0
  - type: checkboxes
    id: games
    attributes:
      label: Games
      description: Leave all unticked to keep the current list. If you tick any, they replace it.
      options:
        - label: Skyrim SE/AE
        - label: Skyrim VR
        - label: Skyrim LE
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Replaces the whole description.
  - type: dropdown
    id: desc-source
    attributes:
      label: Description source
      description: "GitHub README shows your repository's README instead, loaded live from GitHub."
      options:
        - No change
        - Written here
        - GitHub README
      default: 0
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Replaces all screenshots. Drag or paste up to 8 images here. Write none to remove them."
  - type: input
    id: cover
    attributes:
      label: Cover picture
      description: "Which screenshot is the cover (card and page banner)? 1 for the first, 2 for the second, and so on. Works with new screenshots above, or on its own to pick a different cover from your current ones. Leave empty to keep it as it is."
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "Replaces the whole list. One per line, as Name | link. Write none to clear it."
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Replaces all tags. Up to 8, separated by commas. Write none to clear them."
  - type: dropdown
    id: ai
    attributes:
      label: AI use
      options:
        - No change
        - No AI used
        - "AI-assisted: AI helped, but the work is mainly mine"
        - "AI-generated: a large part was made by AI"
      default: 0
  - type: checkboxes
    id: ai-parts
    attributes:
      label: Which parts used AI?
      description: Leave all unticked to keep the current list. If you tick any, they replace it.
      options:
        - label: Voices or other audio
        - label: Textures or images
        - label: Meshes or models
        - label: Scripts or code
        - label: Text, dialogue or descriptions
  - type: dropdown
    id: perm-upload
    attributes:
      label: Upload to other sites
      options: ["No change", "Yes", "Ask me first", "No"]
      default: 0
  - type: dropdown
    id: perm-modify
    attributes:
      label: Modify and re-release
      options: ["No change", "Yes", "Ask me first", "No"]
      default: 0
  - type: dropdown
    id: perm-convert
    attributes:
      label: Convert to other games or versions
      options: ["No change", "Yes", "Ask me first", "No"]
      default: 0
  - type: dropdown
    id: perm-assets
    attributes:
      label: Use assets in other mods
      options: ["No change", "Yes", "Ask me first", "No"]
      default: 0
  - type: dropdown
    id: perm-commercial
    attributes:
      label: Use in paid or commercial mods
      options: ["No change", "Yes", "Ask me first", "No"]
      default: 0
  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: Replaces the credits. Write none to remove them.
  - type: textarea
    id: permission-notes
    attributes:
      label: Permission notes
      description: Replaces the permission notes. Write none to remove them.
  - type: input
    id: donate
    attributes:
      label: Donation link
      description: "Your Ko-fi, Patreon, PayPal or similar page. Write none to remove it."
  - type: dropdown
    id: scan
    attributes:
      label: Virus scan
      description: "See the Add your mod page for what each option means. Mods with no scan show a red Not virus-scanned warning."
      options:
        - No change
        - "Private scan: ClamAV + VirusTotal fingerprint (recommended)"
        - Full scan with VirusTotal
        - No scan
      default: 0
